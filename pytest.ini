[pytest]
# Look for tests only in the tests folder.
testpaths = tests

# Add the project root to the import path so imports like src.testing work.
pythonpath = .

# Fail on a misspelled marker instead of silently running nothing.
addopts = --strict-markers

# Every marker must be registered here, otherwise pytest warns about it.
markers =
    analysis: tests of the statistical analysis
    sampler: tests of the sampling plan and the sampling loop
    unit: fast tests with no network and no real ammeter
    timing: tests that measure real time, slower and sensitive to a busy machine
    client: tests of the TCP client and its errors
    network: tests that open real sockets on localhost
    emulators: tests of the three ammeter emulators
    results: tests of saving, loading and comparing results
    framework: tests of the full test framework
    integration: end to end tests against the real emulators
    report: tests of the HTML report
    faults: tests of the error simulation
